services:
  jellyfin-hue-sync:
    build: .
    image: jellyfin-hue-sync:latest
    container_name: jellyfin-hue-sync
    # Host networking keeps Bridge discovery (subnet scan), the DTLS UDP
    # stream to the Bridge on port 2100, and access to Jellyfin working
    # exactly like they would on the host.
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config:/config
      # Mount the SAME host directory at the SAME target path Jellyfin uses,
      # read-only. Your Jellyfin binds /mnt/user/media -> /media, so do the
      # same here: paths then match 1:1 and the web UI needs no media mapping.
      - /mnt/user/media:/media:ro
    environment:
      - CONFIG_DIR=/config
      - PORT=8091
